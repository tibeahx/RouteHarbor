  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "code",
              "message",
              "retryable"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "retryable": {
                "type": "boolean"
              },
              "fields": {
                "type": "array",
                "items": {
                  "type": "string"
                }
              }
            }
          }
        }
      },
      "Source": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "name",
          "type",
          "enabled",
          "auto",
          "settings"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}$"
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "type": {
            "enum": [
              "direct",
              "socks5",
              "http-connect",
              "sing-box",
              "xray",
              "interface",
              "packet-engine"
            ]
          },
          "enabled": {
            "type": "boolean"
          },
          "auto": {
            "type": "boolean"
          },
          "settings": {
            "type": "object",
            "description": "Adapter-specific allowlist. Empty in normal reads; see docs/probe-paths.md. No arbitrary listeners, files, scripts or engine APIs."
          }
        }
      },
      "Target": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "url",
          "required",
          "status_codes",
          "max_bytes"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "url": {
            "type": "string",
            "format": "uri",
            "maxLength": 2048
          },
          "required": {
            "type": "boolean"
          },
          "status_codes": {
            "type": "array",
            "minItems": 1,
            "items": {
              "type": "integer",
              "minimum": 200,
              "maximum": 599
            },
            "maxItems": 16
          },
          "max_bytes": {
            "type": "integer",
            "minimum": 1,
            "maximum": 8388608
          }
        }
      },
      "Policy": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "mode": {
            "enum": [
              "off",
              "auto",
              "manual"
            ]
          },
          "pinned": {
            "type": "string"
          },
          "fallback": {
            "enum": [
              "closed",
              "direct"
            ]
          },
          "improvement_percent": {
            "type": "number"
          },
          "confirmations": {
            "type": "integer"
          },
          "failure_confirmations": {
            "type": "integer"
          },
          "recovery_confirmations": {
            "type": "integer"
          },
          "min_dwell_seconds": {
            "type": "integer"
          },
          "cooldown_seconds": {
            "type": "integer"
          },
          "stale_after_seconds": {
            "type": "integer"
          },
          "break_existing": {
            "type": "boolean",
            "default": false,
            "description": "Opt in to deleting tracked connections belonging to the previous OpenRHP path after a path switch. Off by default; may interrupt active applications. Requires privileged conntrack support and a newly confirmed routing plan. Foreign connection entries are not flushed, and connections are not migrated between external IPs."
          }
        }
      },
      "ProbeSettings": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "active_interval_seconds": {
            "type": "integer"
          },
          "other_interval_seconds": {
            "type": "integer"
          },
          "speed_interval_seconds": {
            "type": "integer"
          },
          "timeout_seconds": {
            "type": "integer"
          },
          "concurrency": {
            "type": "integer"
          },
          "history_limit": {
            "type": "integer"
          }
        }
      },
      "Network": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "enabled": {
            "type": "boolean"
          },
          "lan_interfaces": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "wan_interface": {
            "type": "string"
          },
          "local_prefixes": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "ipv6": {
            "enum": [
              "block",
              "proxy"
            ]
          },
          "dns": {
            "enum": [
              "block",
              "selected-path"
            ]
          },
          "dns_resolver": {
            "type": "string",
            "description": "Explicit public resolver IP used only through selected source; no default external resolver."
          }
        }
      },
      "Config": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schema_version",
          "revision",
          "role",
          "sources",
          "targets",
          "policy",
          "probes",
          "network"
        ],
        "properties": {
          "schema_version": {
            "const": 1
          },
          "revision": {
            "type": "integer",
            "minimum": 1
