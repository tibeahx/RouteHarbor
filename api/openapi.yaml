{
  "openapi": "3.1.0",
  "info": {
    "title": "RouteHarbor API",
    "version": "0.1.0-dev",
    "description": "RouteHarbor. Authenticated API shared by the UI, CLI and agents. Development status is exposed by capabilities; unavailable network features fail preflight."
