              "application/json": {
                "schema": {
                  "type": "object"
                }
              }
            }
          },
          "400": {
            "description": "Invalid request",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Authentication required"
          },
          "403": {
            "description": "Insufficient scope or origin not allowed"
          },
          "409": {
            "description": "Revision, pending transaction or idempotency conflict"
          },
          "422": {
            "description": "Unsupported or invalid configuration"
          },
          "429": {
            "description": "Rate or queue limit"
          },
          "503": {
            "description": "Capability unavailable"
