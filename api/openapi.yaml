      "get": {
        "operationId": "status",
        "summary": "Current decision, source health and runtime status",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "continuity": {
                      "$ref": "#/components/schemas/ContinuityStatus"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid request",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Authentication required"
          },
          "403": {
            "description": "Insufficient scope or origin not allowed"
          },
          "409": {
            "description": "Revision, pending transaction or idempotency conflict"
          },
          "422": {
            "description": "Unsupported or invalid configuration"
          },
          "429": {
            "description": "Rate or queue limit"
          },
          "503": {
            "description": "Capability unavailable"
          }
        }
      }
    },
